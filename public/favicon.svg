<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    K monogram, bronze on warm near-black. Colours are the theme tokens:
    #0d0c0a (bg), #8a5f31 (accent-dark), #c78b4a → #d8a95a (accent → hover).

    Drawn as strokes rather than set as text: a favicon has no access to the
    page's fonts, so a <text> element would render in whatever the browser
    happened to fall back to — different on every machine.

    Sized to survive 16px. The stroke is 3 units on a 32 grid, so it lands at
    ~1.5 device pixels in a browser tab: heavy enough to read, light enough not
    to fill in. The counters are kept open for the same reason.
  -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8a95a" />
      <stop offset="1" stop-color="#c78b4a" />
    </linearGradient>
  </defs>

  <!-- The plate. A filled background rather than a transparent glyph, so the
       mark stays legible on both light and dark browser chrome. -->
  <rect width="32" height="32" rx="7.5" fill="#0d0c0a" />

  <!-- A hairline of accent-dark, inset by half its own width so it sits fully
       inside the plate instead of being clipped by the edge. -->
  <rect
    x="0.75"
    y="0.75"
    width="30.5"
    height="30.5"
    rx="6.75"
    fill="none"
    stroke="#8a5f31"
    stroke-width="1.5"
    opacity="0.6"
  />

  <g
    fill="none"
    stroke="url(#bronze)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Stem. -->
    <path d="M11 8.5v15" />
    <!-- Arm and leg as one path, so the join at the stem is mitred by the
         renderer rather than showing as two overlapping round caps. The vertex
         sits at x=12.2, just inside the stem's own stroke width, which is what
         makes the three strokes read as a single letter. -->
    <path d="M21 8.5 12.2 16 21 23.5" />
  </g>
</svg>
